<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lex Causae — Septem Leges Universales</title>
<style>
:root {
  --bg-deep: #020308;
  --gold-glow: #e8c987;
  --gold-accent: #ffd992;
  --text-main: #f0eef8;
  --text-sub: #a4a0c0;
  --hud-glass: rgba(8, 12, 28, 0.72);
  --border-glass: rgba(232, 201, 135, 0.28);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Cinzel", "Times New Roman", "Baskerville", Georgia, serif;
  overflow-x: hidden;
  user-select: none;
}

/* Deep Space Canvas für JWST/Hubble-Universum */
canvas#deepSpaceCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

/* Subtile kosmische Farbstaub-Überlagerung */
.jwst-haze {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, rgba(20, 26, 60, 0.15) 0%, rgba(3, 4, 10, 0.75) 85%);
  mix-blend-mode: screen;
}

/* Top Navigation HUD */
.hud-btn {
  position: fixed;
  top: 22px;
  z-index: 20;
  background: var(--hud-glass);
  border: 1px solid var(--border-glass);
  color: var(--gold-glow);
  padding: 9px 18px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  gap: 9px;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(232, 201, 135, 0.15);
}

.hud-btn:hover {
  background: rgba(232, 201, 135, 0.15);
  border-color: var(--gold-glow);
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(232, 201, 135, 0.35);
}

.hud-btn:active {
  transform: translateY(0);
}

#langSwitch { left: 22px; }
#soundToggle { right: 22px; }

/* Hauptbühne */
main {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 85px 16px 60px;
}

header {
  text-align: center;
  max-width: 720px;
  pointer-events: none;
}

h1 {
  font-weight: 300;
  font-size: clamp(1.8rem, 5.2vw, 3.2rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-accent);
  text-shadow: 0 0 25px rgba(232, 201, 135, 0.4), 0 0 70px rgba(232, 201, 135, 0.15);
  margin-bottom: 6px;
}

.subtitle {
  color: var(--text-sub);
  font-size: clamp(0.85rem, 2.2vw, 1.05rem);
  font-style: italic;
  letter-spacing: 0.05em;
}

/* Kosmisches Sonnensystem / Orbit-Bühne */
.cosmic-stage {
  position: relative;
  width: min(94vw, 76vh, 680px);
  aspect-ratio: 1;
  margin-top: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

/* Zentrale Ur-Sonne (Lichtquelle aller Planeten) */
.central-sun {
  position: absolute;
  width: 9.5%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, #fffbe6 30%, #ffd480 65%, transparent 100%);
  box-shadow: 
    0 0 30px rgba(255, 255, 255, 0.9),
    0 0 65px rgba(255, 215, 120, 0.65),
    0 0 130px rgba(232, 201, 135, 0.35);
  pointer-events: none;
  animation: sunRadiance 7s ease-in-out infinite alternate;
}

@keyframes sunRadiance {
  0% { transform: scale(0.96); filter: brightness(1); }
  100% { transform: scale(1.08); filter: brightness(1.25); }
}

/* Umlaufbahnen (Dezente geometrische Gravitationslinien) */
.orbital-path {
  position: absolute;
  border-radius: 50%;
  border: 1px dashed rgba(232, 201, 135, 0.08);
  pointer-events: none;
  transform: translate(-50%, -50%);
  left: 50%;
  top: 50%;
}

/* Authentische NASA-Planeten */
.planet-node {
  position: absolute;
  width: 14.8%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: none;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  outline: none;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease, opacity 0.5s ease;
  z-index: 10;
}

.planet-node:hover {
  transform: translate(-50%, -50%) scale(1.22);
  filter: brightness(1.2);
  z-index: 15;
}

.planet-node:focus-visible {
  outline: 2px solid var(--gold-accent);
  outline-offset: 7px;
}

/* Kugel-Geometrie mit NASA-Schattenwurf zur Kernsonne */
.planet-sphere {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: visible;
}

.planet-body {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
}

/* Planetentexturen (NASA Voyager/Cassini/Juno Stil) */
/* I. Geistigkeit (Neptun / Eis-Ozeanriese) */
.tex-1 {
  background: 
    radial-gradient(ellipse at 70% 30%, rgba(200, 235, 255, 0.4), transparent 60%),
    repeating-linear-gradient(25deg, #1b387a 0px, #2752b0 9px, #182f69 18px, #366cd9 27px, #102047 36px);
  filter: contrast(1.15) saturate(1.25);
}

/* II. Wahrheit (Biolumineszenter Terra-Ozeanplanet mit weißen Sturmbändern) */
.tex-2 {
  background: 
    radial-gradient(circle at 40% 40%, rgba(180, 255, 220, 0.5), transparent 70%),
    radial-gradient(ellipse at 80% 20%, rgba(255, 255, 255, 0.6) 0%, transparent 40%),
    repeating-radial-gradient(ellipse at 20% 70%, #0d5c48 0px, #179675 14px, #083b2e 28px, #2ee0af 38px);
}

/* III. Schwingung (Jupiter Gasriese mit Sturmbandturbulenzen) */
.tex-3 {
  background: 
    radial-gradient(circle at 65% 65%, #c0392b 0%, rgba(192, 57, 43, 0.8) 18%, transparent 35%),
    repeating-linear-gradient(12deg, #6e320f 0px, #c77b38 8px, #3d1a06 16px, #eb9d59 26px, #8c4217 34px);
}

/* IV. Polarität (Mars-Wüstenwelt mit Polkappe und Valles Marineris) */
.tex-4 {
  background: 
    radial-gradient(circle at 50% 95%, #ffffff 0%, #ffffff 12%, transparent 20%),
    radial-gradient(circle at 20% 30%, rgba(0, 0, 0, 0.5) 0%, transparent 40%),
    linear-gradient(135deg, #a63a24 0%, #bf4d32 40%, #591b0f 75%, #3d1108 100%);
}

/* V. Rhythmus (Saturn-Gasriese mit feinem Streifenmuster) */
.tex-5 {
  background: 
    repeating-linear-gradient(0deg, #d4be8a 0px, #a8915b 6px, #e8d8a7 14px, #826e41 22px);
}

/* VI. Kausalität (Phosphoreszierender Tiefen-Exoplanet) */
.tex-6 {
  background: 
    radial-gradient(circle at 30% 60%, rgba(255, 100, 180, 0.6), transparent 50%),
    repeating-linear-gradient(45deg, #3d0725 0px, #80104e 10px, #200213 20px, #d1217e 32px);
}

/* VII. Generierung (Goldener Solar-Terra-Hybrid) */
.tex-7 {
  background: 
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.7), transparent 60%),
    repeating-radial-gradient(circle at 30% 30%, #997300 0px, #e6b800 12px, #4d3a00 24px, #ffd700 36px);
}

/* Sphärischer NASA-Licht- & Schattenschleier (3D Tag/Nacht + Atmosphären-Randglühen) */
.planet-shading {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 30%, rgba(0, 0, 0, 0.7) 65%, #000000 100%);
  box-shadow: 
    inset 2px 2px 5px rgba(255, 255, 255, 0.5),
    inset -5px -5px 12px rgba(0, 0, 0, 0.95),
    0 0 18px var(--atmosphere-color);
}

/* Feinstrukturiertes Ringsystem für Planet V (Saturn) */
.saturn-rings {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 260%;
  height: 65%;
  transform: translate(-50%, -50%) rotate(-28deg);
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(ellipse at center, 
    transparent 0%, 
    transparent 46%, 
    rgba(180, 155, 110, 0.75) 48%, 
    rgba(220, 195, 145, 0.85) 54%, 
    rgba(30, 24, 15, 0.3) 55%, 
    rgba(200, 175, 125, 0.8) 60%, 
    rgba(140, 115, 75, 0.5) 67%, 
    transparent 70%);
  box-shadow: 0 0 12px rgba(210, 185, 135, 0.25);
}

/* Planet-Beschriftung */
.planet-node .planet-label {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);
  margin-top: 10px;
  white-space: nowrap;
  font-size: clamp(0.68rem, 2.1vw, 0.86rem);
  letter-spacing: 0.08em;
  color: var(--text-main);
  text-shadow: 0 2px 8px #000000, 0 0 12px #000000;
  pointer-events: none;
  transition: color 0.3s ease;
}

.planet-node:hover .planet-label {
  color: var(--gold-accent);
}

.cosmic-stage.dimmed .planet-node {
  opacity: 0.12;
  pointer-events: none;
}

/* Lese-Panel (Modal) mit Glassmorphism */
.readout-panel {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  overflow-y: auto;
  background: rgba(3, 4, 10, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 40px 20px;
  cursor: pointer;
}

.readout-panel.active {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: panelZoomIn 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes panelZoomIn {
  from { opacity: 0; transform: scale(0.65); }
  to { opacity: 1; transform: scale(1); }
}

.readout-card {
  max-width: 620px;
  width: 100%;
  background: rgba(11, 15, 34, 0.78);
  border: 1px solid rgba(232, 201, 135, 0.32);
  border-radius: 20px;
  padding: 42px 34px;
  text-align: center;
  cursor: default;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 45px rgba(var(--active-rgb), 0.22);
}

.card-planet-hero {
  width: 90px;
  aspect-ratio: 1;
  border-radius: 50%;
  margin: 0 auto 24px;
  position: relative;
  box-shadow: 0 0 35px rgba(var(--active-rgb), 0.55);
}

.readout-card h2 {
  font-weight: 300;
  font-size: 1.15rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--active-color);
  margin-bottom: 12px;
}

.readout-card .main-headline {
  font-size: clamp(1.35rem, 4.8vw, 1.95rem);
  line-height: 1.35;
  font-weight: 400;
  color: #ffffff;
  margin-bottom: 26px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.readout-card p {
  line-height: 1.8;
  font-size: 1.05rem;
  text-align: left;
  color: #dfdbe8;
  margin-bottom: 18px;
}

.readout-card h3 {
  font-weight: 400;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--gold-accent);
  margin: 28px 0 10px;
  text-align: left;
  letter-spacing: 0.05em;
}

.laws-block p {
  border-left: 2px solid var(--active-color);
  padding-left: 16px;
  margin-bottom: 14px;
  color: #ffffff;
}

/* Schlichte Ebenenanzeige */
.level-indicator {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 32px 0 16px;
}

.level-indicator .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transition: all 0.3s ease;
}

.level-indicator .dot.active {
  background: var(--active-color);
  box-shadow: 0 0 10px var(--active-color);
  transform: scale(1.2);
}

/* Buttons im Panel */
.panel-buttons {
  display: flex;
  gap: 16px;
  justify-content: center;
}

.panel-btn {
  font-family: inherit;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  padding: 11px 28px;
  border-radius: 999px;
  border: 1px solid var(--active-color);
  background: transparent;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.25s ease;
}

.panel-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
}

.panel-btn.accent {
  background: var(--active-color);
  color: #030408;
  font-weight: 600;
  box-shadow: 0 4px 18px rgba(var(--active-rgb), 0.35);
}

.panel-btn.accent:hover {
  filter: brightness(1.2);
}

@media (max-width: 600px) {
  .readout-card {
    padding: 30px 20px;
  }
  .hud-btn {
    padding: 8px 14px;
    font-size: 0.76rem;
  }
}
</style>
</head>

/* 2. Spezifikationen der 7 NASA-Planeten */
const PLANET_ASSETS = [
  { roman: "I", color: "#64a4ff", rgb: "100, 164, 255", atmo: "rgba(100, 164, 255, 0.45)", texClass: "tex-1", bowlFreq: 432 },
  { roman: "II", color: "#46e0a8", rgb: "70, 224, 168", atmo: "rgba(70, 224, 168, 0.45)", texClass: "tex-2", bowlFreq: 486 },
  { roman: "III", color: "#e88b3f", rgb: "232, 139, 63", atmo: "rgba(232, 139, 63, 0.45)", texClass: "tex-3", bowlFreq: 540 },
  { roman: "IV", color: "#e74c3c", rgb: "231, 76, 60", atmo: "rgba(231, 76, 60, 0.45)", texClass: "tex-4", bowlFreq: 576 },
  { roman: "V", color: "#c8a5ff", rgb: "200, 165, 255", atmo: "rgba(200, 165, 255, 0.45)", texClass: "tex-5", ring: true, bowlFreq: 648 },
  { roman: "VI", color: "#ff4d88", rgb: "255, 77, 136", atmo: "rgba(255, 77, 136, 0.45)", texClass: "tex-6", bowlFreq: 720 },
  { roman: "VII", color: "#ffd54f", rgb: "255, 213, 79", atmo: "rgba(255, 213, 79, 0.45)", texClass: "tex-7", bowlFreq: 864 }
];

let currentLang = "DE";
const availableLangs = ["DE", "EN", "ES"];
const clientLang = (navigator.language || "").slice(0, 2).toUpperCase();
if (availableLangs.includes(clientLang)) currentLang = clientLang;

/* DOM Elemente */
const cosmicStage = document.getElementById("cosmicStage");
const readoutPanel = document.getElementById("readoutPanel");
const readoutCard = document.getElementById("readoutCard");
const titleHeader = document.getElementById("titleHeader");
const subHeader = document.getElementById("subHeader");
const langDisplay = document.getElementById("langDisplay");
const soundDisplay = document.getElementById("soundDisplay");

let activePlanetIndex = null;
let currentDepthLevel = 0;
let lastFocusedPlanet = null;

/* Web Audio API Synthesizer für authentische Kristall-Klangschalen */
let audioCtx = null;
let masterGain = null;
let isAudioActive = false;
let ambientInterval = null;

function initAudioEngine() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);

  // Hochpassfilter: Eliminiert dumpfes Bassbrummen unter 200 Hz vollständig
  const highpass = audioCtx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.setValueAtTime(215, audioCtx.currentTime);

  masterGain.connect(highpass);
  highpass.connect(audioCtx.destination);
}

function playSingingBowlChime(freq = 432, duration = 8.5, intensity = 0.24) {
  if (!audioCtx || !isAudioActive) return;
  const now = audioCtx.currentTime;

  // Spektrum echter Quarzkristall-Schalen (Harmonische Schwebung)
  const bowlHarmonics = [
    { ratio: 1.0, amp: 1.0, detune: -0.8 },
    { ratio: 1.0, amp: 0.95, detune: 0.7 },
    { ratio: 2.76, amp: 0.22, detune: 0.0 },
    { ratio: 5.40, amp: 0.08, detune: 0.0 }
  ];

  bowlHarmonics.forEach(h => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * h.ratio, now);
    osc.detune.setValueAtTime(h.detune, now);

    // Sanfter Kristallanschlag und langes Ausklingen
    const attack = 0.85;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(intensity * h.amp, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(g);
    g.connect(masterGain);

    osc.start(now);
    osc.stop(now + duration + 0.1);
  });
}

function startAmbientSoundBath() {
  const notes = [432, 540, 648, 432, 576];
  let ptr = 0;
  playSingingBowlChime(432, 9.0, 0.24);

  ambientInterval = setInterval(() => {
    if (!isAudioActive) return;
    playSingingBowlChime(notes[ptr % notes.length], 9.5, 0.2);
    ptr++;
  }, 6800);
}

function toggleAudio() {
  initAudioEngine();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const t = MANIFEST[currentLang];
  if (!isAudioActive) {
    masterGain.gain.setTargetAtTime(1.0, audioCtx.currentTime, 1.2);
    isAudioActive = true;
    soundDisplay.textContent = t.soundOn;
    startAmbientSoundBath();
  } else {
    masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
    isAudioActive = false;
    soundDisplay.textContent = t.soundOff;
    if (ambientInterval) clearInterval(ambientInterval);
  }
}
document.getElementById("soundToggle").onclick = toggleAudio;

function setupStage() {
  cosmicStage.querySelectorAll(".planet-node, .orbital-path").forEach(e => e.remove());
  const langData = MANIFEST[currentLang];

  PLANET_ASSETS.forEach((p, idx) => {
    // Umlaufbahnen
    const angle = 0.65 + idx * 1.05;
    const distancePercent = 14 + idx * 5.6;

    const orbit = document.createElement("div");
    orbit.className = "orbital-path";
    orbit.style.width = `${distancePercent * 2}%`;
    orbit.style.height = `${distancePercent * 2}%`;
    cosmicStage.appendChild(orbit);

    // Planet-Button
    const btn = document.createElement("button");
    btn.className = "planet-node";
    btn.setAttribute("aria-label", langData.principles[idx].name);
    btn.style.left = `${50 + distancePercent * Math.cos(angle)}%`;
    btn.style.top = `${50 + distancePercent * Math.sin(angle)}%`;
    btn.style.setProperty("--atmosphere-color", p.atmo);

    let ringsHTML = p.ring ? `<div class="saturn-rings"></div>` : "";
    btn.innerHTML = `
      <div class="planet-sphere">
        ${ringsHTML}
        <div class="planet-body ${p.texClass}"></div>
        <div class="planet-shading"></div>
      </div>
      <div class="planet-label">${p.roman}. ${langData.principles[idx].name}</div>
    `;

    btn.onclick = () => {
      playSingingBowlChime(p.bowlFreq, 7.5, 0.28);
      openReadout(idx, btn);
    };

    cosmicStage.appendChild(btn);
  });
}

function updateHUDText() {
  const t = MANIFEST[currentLang];
  titleHeader.textContent = t.title;
  subHeader.textContent = t.sub;
  langDisplay.textContent = currentLang;
  soundDisplay.textContent = isAudioActive ? t.soundOn : t.soundOff;
  document.title = `${t.title} — Septem Leges Universales`;
}

function switchLanguage() {
  const idx = (availableLangs.indexOf(currentLang) + 1) % availableLangs.length;
  currentLang = availableLangs[idx];
  updateHUDText();
  setupStage();
  if (activePlanetIndex !== null && readoutPanel.classList.contains("active")) {
    renderCardContent();
  }
}
document.getElementById("langSwitch").onclick = switchLanguage;

function renderCardContent() {
  const p = PLANET_ASSETS[activePlanetIndex];
  const item = MANIFEST[currentLang].principles[activePlanetIndex];
  const t = MANIFEST[currentLang];

  readoutCard.style.setProperty("--active-color", p.color);
  readoutCard.style.setProperty("--active-rgb", p.rgb);

  let innerBody = "";
  if (currentDepthLevel === 2) {
    innerBody = `
      <h2>${p.roman} · ${item.name}</h2>
      <div class="main-headline" style="font-size:clamp(1.2rem,4.2vw,1.65rem);margin-bottom:12px;">${item.headline}</div>
      <h3>${t.principleHeading}</h3>
      <p>${item.mechanic}</p>
      <h3>${t.actHeading}</h3>
      <p>${item.command}</p>
    `;
  } else {
    innerBody = `
      <h2>${p.roman} · ${item.name}</h2>
      <div class="main-headline">${item.headline}</div>
      <div class="laws-block">
        ${item.laws.map(l => `<p>${l}</p>`).join("")}
      </div>
    `;
  }

  const fathomBtnHTML = currentDepthLevel === 1 
    ? `<button class="panel-btn accent" id="cardFathom">${t.fathomBtn}</button>` 
    : "";

  readoutCard.innerHTML = `
    <div class="card-planet-hero ${p.texClass}">
      <div class="planet-shading"></div>
    </div>
    ${innerBody}
    <div class="level-indicator">
      <div class="dot ${currentDepthLevel >= 1 ? 'active' : ''}"></div>
      <div class="dot ${currentDepthLevel === 2 ? 'active' : ''}"></div>
    </div>
    <div class="panel-buttons">
      <button class="panel-btn" id="cardBack">${t.backBtn}</button>
      ${fathomBtnHTML}
    </div>
  `;

  document.getElementById("cardBack").onclick = stepBack;
  if (currentDepthLevel === 1) {
    document.getElementById("cardFathom").onclick = () => {
      playSingingBowlChime(p.bowlFreq * 1.333, 6.5, 0.25);
      currentDepthLevel = 2;
      renderCardContent();
      readoutPanel.scrollTop = 0;
    };
  }
}

function openReadout(idx, btn) {
  activePlanetIndex = idx;
  currentDepthLevel = 1;
  lastFocusedPlanet = btn;

  const rect = btn.getBoundingClientRect();
  readoutPanel.style.transformOrigin = `${rect.left + rect.width / 2}px ${rect.top + rect.height / 2}px`;

  renderCardContent();
  readoutPanel.classList.add("active");
  readoutPanel.scrollTop = 0;
  cosmicStage.classList.add("dimmed");
  document.getElementById("cardBack").focus();
}

function stepBack() {
  if (currentDepthLevel === 2) {
    currentDepthLevel = 1;
    renderCardContent();
    readoutPanel.scrollTop = 0;
    return;
  }
  readoutPanel.classList.remove("active");
  cosmicStage.classList.remove("dimmed");
  currentDepthLevel = 0;
  if (lastFocusedPlanet) lastFocusedPlanet.focus();
}

readoutPanel.addEventListener("click", e => {
  if (e.target === readoutPanel) stepBack();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && currentDepthLevel > 0) stepBack();
});

/* Prozeduraler Hubble/JWST Weltraum-Renderer auf HTML5 Canvas */
const canvas = document.getElementById("deepSpaceCanvas");
const ctx = canvas.getContext("2d");
let width, height;
let stars = [];
let galaxies = [];
let meteors = [];
let nebulae = [];
let nextMeteorTime = 2000;

// Farbtemperaturen realer Sterne (O, B, A, F, G, K, M)
const STAR_SPECTRA = [
  "220, 235, 255", // O/B: Blau-Weiß
  "255, 255, 255", // A: Reines Weiß
  "255, 248, 220", // F/G: Sonnengelb
  "255, 214, 170", // K: Orange
  "255, 175, 160"  // M: Rötlich
];

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initDeepSpace();
}

function initDeepSpace() {
  // 1. Vielschichtige kosmische Nebelwolken (Pillars of Creation / Carina Nebel Look)
  nebulae = [
    { x: width * 0.22, y: height * 0.28, rx: width * 0.35, ry: height * 0.26, rgb: "115, 60, 215", alpha: 0.18, rot: 0.4 },
    { x: width * 0.78, y: height * 0.32, rx: width * 0.38, ry: height * 0.28, rgb: "235, 75, 140", alpha: 0.14, rot: -0.3 },
    { x: width * 0.65, y: height * 0.75, rx: width * 0.45, ry: height * 0.35, rgb: "35, 135, 245", alpha: 0.16, rot: 0.2 },
    { x: width * 0.18, y: height * 0.82, rx: width * 0.32, ry: height * 0.25, rgb: "235, 165, 80", alpha: 0.12, rot: -0.5 }
  ];

  // 2. Tausende fotorealistische Sterne
  const count = Math.round((width * height) / 3600);
  stars = [];
  for (let i = 0; i < count; i++) {
    const isBrightSpikeStar = Math.random() < 0.022; // JWST Diffraction-Spike Sterne
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: isBrightSpikeStar ? Math.random() * 1.4 + 1.2 : Math.random() * 0.9 + 0.25,
      spectrum: STAR_SPECTRA[Math.floor(Math.random() * STAR_SPECTRA.length)],
      twinkleSpeed: Math.random() * 1.5 + 0.5,
      phase: Math.random() * Math.PI * 2,
      hasSpikes: isBrightSpikeStar
    });
  }

  // 3. Ferne Spiralgalaxien
  galaxies = [
    { x: width * 0.15, y: height * 0.18, radius: 24, tilt: 0.55, rot: 0.7, rgb: "210, 225, 255" },
    { x: width * 0.86, y: height * 0.82, radius: 32, tilt: 0.35, rot: -0.8, rgb: "255, 220, 190" }
  ];
}

function spawnMeteor() {
  const angle = Math.random() * 0.4 + 0.35;
  const direction = Math.random() < 0.5 ? 1 : -1;
  meteors.push({
    x: Math.random() * width * (direction > 0 ? 0.8 : 1),
    y: Math.random() * height * 0.35,
    vx: Math.cos(angle) * direction * (14 + Math.random() * 8),
    vy: Math.sin(angle) * (14 + Math.random() * 8),
    length: 50 + Math.random() * 45,
    life: 0,
    maxLife: 28 + Math.random() * 20
  });
}

function drawGalaxies() {
  for (const g of galaxies) {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    ctx.scale(1, g.tilt);

    // Galaxiekern
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, g.radius);
    coreGrad.addColorStop(0, `rgba(${g.rgb}, 0.65)`);
    coreGrad.addColorStop(0.3, `rgba(${g.rgb}, 0.25)`);
    coreGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, g.radius, 0, Math.PI * 2);
    ctx.fill();

    // Spiralarme
    ctx.strokeStyle = `rgba(${g.rgb}, 0.18)`;
    ctx.lineWidth = 1.2;
    for (let arm = 0; arm < 2; arm++) {
      ctx.beginPath();
      for (let theta = 0; theta < 4; theta += 0.1) {
        const r = (g.radius * 0.25) * Math.exp(0.35 * theta);
        const a = theta + arm * Math.PI;
        const ax = r * Math.cos(a);
        const ay = r * Math.sin(a);
        if (theta === 0) ctx.moveTo(ax, ay);
        else ctx.lineTo(ax, ay);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

function renderDeepSpaceFrame(timestamp) {
  ctx.clearRect(0, 0, width, height);

  // 1. Organische kosmische Nebelschwaden zeichnen
  for (const neb of nebulae) {
    ctx.save();
    ctx.translate(neb.x, neb.y);
    ctx.rotate(neb.rot);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(neb.rx, neb.ry));
    grad.addColorStop(0, `rgba(${neb.rgb}, ${neb.alpha})`);
    grad.addColorStop(0.5, `rgba(${neb.rgb}, ${neb.alpha * 0.45})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, neb.rx, neb.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 2. Galaxien
  drawGalaxies();

  // 3. Sterne mit Funkeln und JWST Beugungskreuzen (Diffraction Spikes)
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin((timestamp / 1000) * s.twinkleSpeed + s.phase);
    const alpha = 0.25 + 0.75 * twinkle;

    ctx.fillStyle = `rgba(${s.spectrum}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius * (0.85 + 0.25 * twinkle), 0, Math.PI * 2);
    ctx.fill();

    // Beugungskreuze für signifikante Sterne
    if (s.hasSpikes) {
      const spikeLen = s.radius * 4.8 * (0.7 + 0.3 * twinkle);
      ctx.strokeStyle = `rgba(${s.spectrum}, ${alpha * 0.6})`;
      ctx.lineWidth = 0.65;

      ctx.beginPath();
      ctx.moveTo(s.x - spikeLen, s.y);
      ctx.lineTo(s.x + spikeLen, s.y);
      ctx.moveTo(s.x, s.y - spikeLen);
      ctx.lineTo(s.x, s.y + spikeLen);
      ctx.stroke();
    }
  }

  // 4. Sternschnuppen (Meteore)
  if (timestamp > nextMeteorTime) {
    spawnMeteor();
    nextMeteorTime = timestamp + 3200 + Math.random() * 5500;
  }

  meteors = meteors.filter(m => m.life < m.maxLife);
  for (const m of meteors) {
    m.x += m.vx;
    m.y += m.vy;
    m.life++;

    const progress = 1 - m.life / m.maxLife;
    const tailX = m.x - m.vx * 3.5;
    const tailY = m.y - m.vy * 3.5;

    const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255, 255, 255, ${progress})`);
    grad.addColorStop(1, 'rgba(160, 200, 255, 0)');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();
  }

  requestAnimationFrame(renderDeepSpaceFrame);
}

// Initialer Start des gesamten Universums
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
updateHUDText();
setupStage();
requestAnimationFrame(renderDeepSpaceFrame);
