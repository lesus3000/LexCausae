<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die sieben Gesetze der Ursache</title>
<style>
:root{--bg:#04060d;--ink:#eae6f7;--mute:#9a96b8;--gold:#e8c987}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 45%,#0d1127 0%,#060814 60%,var(--bg) 100%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}

.nebula-layer{position:fixed;inset:-20%;z-index:0;pointer-events:none;mix-blend-mode:screen;filter:blur(36px)}
.nebula-1{
  background:
    radial-gradient(ellipse 45% 35% at 20% 25%, rgba(138, 43, 226, 0.28), transparent 70%),
    radial-gradient(ellipse 40% 30% at 80% 30%, rgba(255, 64, 129, 0.22), transparent 70%),
    radial-gradient(ellipse 50% 40% at 65% 75%, rgba(0, 180, 255, 0.24), transparent 70%);
  animation:driftNebula 90s ease-in-out infinite alternate;
}
.nebula-2{
  background:
    radial-gradient(ellipse 35% 25% at 30% 70%, rgba(232, 201, 135, 0.16), transparent 70%),
    radial-gradient(ellipse 30% 20% at 70% 60%, rgba(100, 220, 180, 0.18), transparent 70%),
    radial-gradient(ellipse 45% 35% at 50% 40%, rgba(90, 40, 180, 0.2), transparent 70%);
  animation:driftNebula 130s ease-in-out infinite alternate-reverse;
  transform:scaleX(-1);
}
@keyframes driftNebula{
  0%{transform:translate(-3%,-2%) scale(1) rotate(0deg)}
  100%{transform:translate(3%,2%) scale(1.15) rotate(5deg)}
}

canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.top-bar-btn{
  position:fixed;top:20px;z-index:10;
  background:rgba(13,17,39,.65);border:1px solid var(--gold);color:var(--gold);
  padding:8px 16px;border-radius:999px;font:inherit;font-size:0.85rem;cursor:pointer;
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;
  transition:all .3s ease;box-shadow:0 0 15px rgba(232,201,135,.2);
}
.top-bar-btn:hover{background:var(--gold);color:#04060d;box-shadow:0 0 25px rgba(232,201,135,.5)}
.top-bar-btn span.icon{font-size:1rem}

#langBtn{left:20px}
#audioBtn{right:20px}

main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
h1{font-weight:400;font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:.08em;text-align:center;color:var(--gold);text-shadow:0 0 25px rgba(232,201,135,.4)}
.sub{color:var(--mute);margin-top:8px;text-align:center;font-style:italic;font-size:1rem}

.stage{position:relative;width:min(94vw,78vh,660px);aspect-ratio:1;margin-top:20px;transition:opacity .5s}

.stage::before{
  content:"";position:absolute;left:50%;top:50%;width:10%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#ffffff 0%,#fff5d6 25%,#e8c98788 55%,transparent 75%);
  box-shadow:0 0 45px rgba(232,201,135,.8), 0 0 90px rgba(232,201,135,.3);
  animation:sunPulse 6s ease-in-out infinite alternate;
}
@keyframes sunPulse{0%{transform:translate(-50%,-50%) scale(.95);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}

.planet{
  position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;cursor:pointer;
  color:#fff;font:inherit;font-size:clamp(.8rem,2.6vw,1.1rem);
  box-shadow:inset -10px -8px 16px rgba(0,0,0,.85), 0 0 24px color-mix(in srgb,var(--c) 65%,transparent);
  transition:transform .35s ease, filter .35s ease, opacity .5s;
}
.planet::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 3px 3px 8px rgba(255,255,255,.55), inset -4px -4px 12px rgba(0,0,0,.9);
  pointer-events:none;
}
.planet:hover{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.15);z-index:2}
.planet span{
  position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:8px;
  white-space:nowrap;font-size:clamp(.62rem,2.2vw,.85rem);color:var(--ink);
  text-shadow:0 0 10px #000, 0 0 4px #000;pointer-events:none;letter-spacing:.03em;
}
.planet:focus-visible{outline:2px solid var(--gold);outline-offset:6px}

.planet.has-ring::before{
  content:"";position:absolute;left:50%;top:50%;width:190%;height:45%;
  transform:translate(-50%,-50%) rotate(-25deg);
  border-radius:50%;
  border:4px solid color-mix(in srgb, var(--c) 45%, transparent);
  box-shadow:0 0 10px color-mix(in srgb, var(--c) 30%, transparent);
  pointer-events:none;
}

.stage.focus .planet{opacity:.12;pointer-events:none}

.panel{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;background:rgba(4,6,13,.86);backdrop-filter:blur(12px);padding:32px 20px;cursor:pointer}
.panel.open{display:block;animation:zoom .45s cubic-bezier(.16,1,.3,1)}
@keyframes zoom{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}
.card{max-width:560px;margin:0 auto;text-align:center;cursor:default}
.planet-preview{
  width:84px;aspect-ratio:1;border-radius:50%;margin:8px auto 20px;position:relative;
  box-shadow:inset -14px -10px 22px rgba(0,0,0,.9), 0 0 40px color-mix(in srgb,var(--c) 60%,transparent);
}
.planet-preview::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 4px 4px 10px rgba(255,255,255,.6), inset -6px -6px 14px rgba(0,0,0,.9);
}
.card h2{font-weight:400;font-size:1.05rem;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.card .head{font-size:clamp(1.35rem,5vw,1.9rem);line-height:1.35;margin:14px 0 26px}
.card p{line-height:1.7;font-size:1.05rem;margin-bottom:16px;text-align:left}
.card h3{font-weight:400;font-style:italic;color:var(--gold);font-size:1.05rem;margin:24px 0 8px;text-align:left}
.laws p{border-left:2px solid var(--c);padding-left:14px;margin-bottom:12px}
.indicator{display:flex;justify-content:center;gap:6px;margin:28px 0 14px}
.dot{width:6px;height:6px;border-radius:50%;background:#ffffff22;transition:background .3s}
.dot.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.btns{display:flex;gap:14px;justify-content:center}
.btns button{font:inherit;font-size:.95rem;padding:10px 24px;border-radius:999px;border:1px solid var(--c);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.btns button.main{background:var(--c);color:#04060d;font-weight:bold}
.btns button:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.btns button.main:hover{background:var(--c);filter:brightness(1.15)}
.btns button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.nebula-layer,.stage::before{animation:none}.panel.open{animation:none}}
</style>
</head>

let currentLang = 'DE';
const langKeys = ['DE', 'EN', 'ES'];

  currentLang = browserLang;

let audioCtx = null;
let masterGain = null;
let droneOscs = [];
let audioActive = false;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  const baseFreqs = [108, 216, 324, 432];
  baseFreqs.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq + (Math.random() * 0.8 - 0.4), audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08 / (idx + 1), audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();
    droneOscs.push(osc);
  });
}

function toggleAudio() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const btnText = document.getElementById('audioText');
  const t = I18N[currentLang];
  if (!audioActive) {
    masterGain.gain.setTargetAtTime(0.35, audioCtx.currentTime, 2.5);
    audioActive = true;
    btnText.textContent = t.audioActive;
    playSingingBowl(216);
  } else {
    masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
    audioActive = false;
    btnText.textContent = t.audioIdle;
  }
}

function playSingingBowl(freq = 216) {
  if (!audioCtx || !audioActive) return;
  const now = audioCtx.currentTime;
  const harmonics = [1, 2.01, 3.02, 4.18];
  harmonics.forEach((h, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * h, now);
    const attack = 0.02;
    const decay = 4.5 / (i + 1);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.25 / (i + 1), now + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + decay);
  });
}

  { n:'V', c:'#b388ff', freq:432, ring:true, surface:'radial-gradient(circle at 35% 35%, #e1d0ff 0%, #7e57c2 45%, #4527a0 85%, #18093d 100%)' },
  { n:'VI', c:'#ff6584', freq:528, surface:'radial-gradient(circle at 35% 35%, #ffb6c1 0%, #d81b60 45%, #7b0d34 85%, #29020f 100%)' },
  { n:'VII', c:'#e5c158', freq:639, surface:'radial-gradient(circle at 35% 35%, #fff6cc 0%, #c49f32 45%, #6d540d 85%, #231b02 100%)' }
];

const stage = document.getElementById('stage');
const panel = document.getElementById('panel');
const card = document.getElementById('card');
let cur = null, layer = 0, lastBtn = null;

function renderOrbs() {
  stage.innerHTML = '';
  const langData = I18N[currentLang];
  PLANET_CONFIG.forEach((cfg, i) => {
    const item = langData.items[i];
    const t = 0.65 + i * 1.06, r = 12.5 + i * 5.6;
    const b = document.createElement('button');
    b.className = 'planet' + (cfg.ring ? ' has-ring' : '');
    b.setAttribute('aria-label', item.name);
    b.style.cssText = `left:${50+r*Math.cos(t)}%;top:${50+r*Math.sin(t)}%;--c:${cfg.c};background:${cfg.surface}`;
    b.innerHTML = `${cfg.n}<span>${item.name}</span>`;
    b.onclick = () => {
      playSingingBowl(cfg.freq);
      open(i, b);
    };
    stage.appendChild(b);
  });
}

function updateStaticText() {
  const t = I18N[currentLang];
  document.getElementById('mainTitle').textContent = t.title;
  document.getElementById('mainSub').textContent = t.sub;
  document.getElementById('langText').textContent = currentLang;
  document.getElementById('audioText').textContent = audioActive ? t.audioActive : t.audioIdle;
  document.title = t.title;
}

function switchLanguage() {
  const nextIdx = (langKeys.indexOf(currentLang) + 1) % langKeys.length;
  currentLang = langKeys[nextIdx];
  updateStaticText();
  renderOrbs();
  if (cur !== null && panel.classList.contains('open')) {
    renderPanel();
  }
}
document.getElementById('langBtn').onclick = switchLanguage;

function renderPanel() {
  const cfg = PLANET_CONFIG[cur];
  const item = I18N[currentLang].items[cur];
  const t = I18N[currentLang];
  let body;

  if (layer === 2) {
    body = `<h2>${cfg.n} · ${item.name}</h2>
    <p class="head" style="font-size:clamp(1.2rem,4.5vw,1.6rem);margin:14px 0 8px;line-height:1.4">${item.head}</p>
    <h3>${t.principleTitle}</h3><p>${item.mech}</p>
    <h3>${t.actTitle}</h3><p>${item.prax}</p>`;
  } else {
    body = `<h2>${cfg.n} · ${item.name}</h2>
    <div class="head">${item.head}</div>
    <div class="laws">${item.laws.map(l => `<p>${l}</p>`).join('')}</div>`;
  }

  const deeper = layer === 1 ? `<button class="main" id="deeper">${t.btnDeeper}</button>` : '';
  card.style.setProperty('--c', cfg.c);
  card.innerHTML = `<div class="planet-preview" style="background:${cfg.surface};--c:${cfg.c}"></div>${body}
  <div class="indicator">
    <span class="dot ${layer>=1?'on':''}"></span>
    <span class="dot ${layer===2?'on':''}"></span>
  </div>
  <div class="btns"><button id="back">${t.btnBack}</button>${deeper}</div>`;
  
  document.getElementById('back').onclick = back;
  if (layer === 1) {
    document.getElementById('deeper').onclick = () => {
      playSingingBowl(cfg.freq * 1.5);
      layer = 2;
      renderPanel();
      panel.scrollTop = 0;
    };
  }
  panel.style.setProperty('--c', cfg.c);
}

function open(i, b) {
  cur = i; layer = 1; lastBtn = b;
  const r = b.getBoundingClientRect();
  panel.style.transformOrigin = `${r.left + r.width / 2}px ${r.top + r.height / 2}px`;
  renderPanel();
  panel.classList.add('open');
  panel.scrollTop = 0;
  stage.classList.add('focus');
  document.getElementById('back').focus();
}

function back() {
  if (layer === 2) {
    layer = 1;
    renderPanel();
    panel.scrollTop = 0;
    return;
  }
  panel.classList.remove('open');
  stage.classList.remove('focus');
  layer = 0;
  if (lastBtn) lastBtn.focus();
}

panel.addEventListener('click', e => { if (e.target === panel) back(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer) back(); });

const cv = document.getElementById('sky'), cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
let W, H, stars = [], shoots = [], nextShoot = 2000;
const tints = ['255,255,255', '255,255,255', '255,240,200', '200,225,255'];

function initSky() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({length: Math.round(W * H / 5500)}, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .2,
    p: Math.random() * 6.28, s: Math.random() * 1.6 + .4,
    c: tints[Math.floor(Math.random() * tints.length)]
  }));
}

function spawnShoot() {
  const a = (Math.random() * .5 + .3), dir = Math.random() < .5 ? 1 : -1;
  shoots.push({
    x: Math.random() * W * (dir > 0 ? .7 : 1), y: Math.random() * H * .4,
    vx: Math.cos(a) * dir * (10 + Math.random() * 6), vy: Math.sin(a) * (10 + Math.random() * 6),
    life: 0, max: 40 + Math.random() * 25
  });
}

function frameSky(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of stars) {
    const k = still ? .7 : .5 + .5 * Math.sin(t / 1000 * s.s + s.p);
    const al = .2 + .8 * k;
    cx.fillStyle = `rgba(${s.c},${al})`;
    cx.beginPath(); cx.arc(s.x, s.y, s.r * (.8 + .3 * k), 0, 6.283); cx.fill();
  }
  if (!still) {
    if (t > nextShoot) { spawnShoot(); nextShoot = t + 3000 + Math.random() * 5000; }
    shoots = shoots.filter(s => s.life < s.max);
    for (const s of shoots) {
      s.x += s.vx; s.y += s.vy; s.life++;
      const f = 1 - s.life / s.max, tx = s.x - s.vx * 6, ty = s.y - s.vy * 6;
      const g = cx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${f})`); g.addColorStop(1, 'rgba(180,200,255,0)');
      cx.strokeStyle = g; cx.lineWidth = 1.6; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(tx, ty); cx.stroke();
    }
    requestAnimationFrame(frameSky);
  }
}

updateStaticText();
renderOrbs();
initSky();
addEventListener('resize', () => { initSky(); if (still) frameSky(0); });
requestAnimationFrame(frameSky);
</script>
</body>
</html>
